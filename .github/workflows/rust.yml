name: Rust

on:
  push:
    branches: [ "master" ]
  # Every pull request, whatever it targets, so stacked PRs are checked too.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test-x86:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: avx2 (default)
            args: ""
          - name: sse2
            args: "--no-default-features --features simd_sse2"
          - name: portable (no SIMD)
            args: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo build --release --verbose ${{ matrix.args }}
      - run: cargo test --release --verbose ${{ matrix.args }}
      - name: config check with the sample config
        run: |
          mkdir -p /tmp/plots
          sed -e "s#^plot_dirs:.*#plot_dirs: ['test_data']#" -e "/^  - '/d" config.yaml > /tmp/config.yaml
          ./target/release/signum-miner --config /tmp/config.yaml --check
      - name: plotter smoke test (CPU)
        run: |
          mkdir -p /tmp/plots
          ./target/release/signum-plotter --id 10282355196851764065 --path /tmp/plots --nonces 8 --threads 2
          cmp -n 2097144 /tmp/plots/10282355196851764065_0_8 test_data/10282355196851764065_0_8

  gui-tests:
    name: GUI logic tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/ui -v

  test-opencl:
    name: build + test (opencl feature, pocl runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: opencl
      - name: Install an OpenCL runtime (pocl runs kernels on the CPU)
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd
      - run: cargo clippy --all-targets --features opencl -- -D warnings
      - run: cargo build --release --features opencl
      - run: cargo test --release --features opencl
      - name: GPU plot matches the CPU reference plot
        run: |
          ./target/release/signum-plotter --list-devices
          mkdir -p /tmp/gpu-plots
          ./target/release/signum-plotter --id 10282355196851764065 --path /tmp/gpu-plots --nonces 8 --gpu 0:0
          cmp -n 2097144 /tmp/gpu-plots/10282355196851764065_0_8 test_data/10282355196851764065_0_8

  test-aarch64:
    name: build + test (aarch64, NEON, Raspberry Pi target)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Build with default features (build script must pick NEON)
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Run the test suite under qemu
        run: cargo test --release --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: signum-miner-aarch64-neon
          path: |
            target/aarch64-unknown-linux-gnu/release/signum-miner
            target/aarch64-unknown-linux-gnu/release/signum-plotter
